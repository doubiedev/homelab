---
services:
  bind9:
    image: ubuntu/bind9:9.20-24.10_beta
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./config:/etc/bind
      - ./cache:/var/cache/bind
      - ./records:/var/lib/bind
    environment:
      - BIND9_USER=root
      - TZ=Australia/Melbourne
    deploy:
      placement:
        constraints:
          - node.hostname == srv-1
      restart_policy:
        condition: on-failure
