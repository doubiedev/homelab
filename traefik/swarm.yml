---
services:
  traefik:
    image: docker.io/library/traefik:v3.7
    networks:
      - frontend
      - backend
    ports:
      # - 80:80
      # - 443:443
      # -- (Optional) Enable Dashboard, don't do in production
      # - 8080:8080
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/conf/:/etc/traefik/conf/
      - ./config/certs/:/var/traefik/certs/
      - ./logs:/logs
    environment:
      - TZ=Australia/Melbourne
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_api_token
    secrets:
      - cloudflare_api_token
    deploy:
      placement:
        constraints:
          - node.hostname == srv-1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=frontend
        - traefik.http.services.traefik.loadbalancer.server.port=8080
        - traefik.http.routers.dashboard.tls=true
        - traefik.http.routers.dashboard.tls.certresolver=cloudflare
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.rule=Host(`traefik.doubie.dev`)
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=authentik@file
networks:
  frontend:
    external: true
  backend:
    external: true
secrets:
  cloudflare_api_token:
    external: true
